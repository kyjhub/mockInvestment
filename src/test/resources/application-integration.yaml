# 통합 테스트 profile. 접속 정보는 IntegrationTestContainers가 @DynamicPropertySource로 덮어쓴다.
spring:
  flyway:
    # 운영 마이그레이션 + 테스트 전용 테이블(벤치마크 엔티티가 테스트 클래스패스에서 함께 스캔된다).
    locations: classpath:db/migration,classpath:db/test-migration
  jpa:
    hibernate:
      # 스키마는 운영과 같은 Flyway 마이그레이션으로 만들고, 엔티티와 맞는지 검증한다.
      # update로 두면 마이그레이션에 빠진 컬럼을 Hibernate가 몰래 채워 넣어 운영에서야 터진다.
      ddl-auto: validate

# 외부 연결과 background 작업이 테스트에 끼어들지 않게 한다.
toss-invest:
  openapi:
    client-id: test-client-id
    secret-token: test-secret-token
  websocket:
    enabled: false
    slot-heartbeat-ms: 3600000
    declare-debounce-ms: 3600000
orderbook:
  active-symbols:
    refresh-ms: 3600000
  polling:
    fixed-delay-ms: 3600000
    idle-fixed-delay-ms: 3600000
price:
  polling:
    fixed-delay-ms: 3600000
order:
  awaiting-price:
    fixed-delay-ms: 3600000
matching-engine:
  stream:
    pending-recovery-delay-ms: 3600000
  rematch:
    fixed-delay-ms: 3600000
  dirty-drain:
    fixed-delay-ms: 3600000
