# 트랜잭션 경계 벤치마크 전용 설정.
# docker compose 를 55432/56379 포트로 띄운 로컬 컨테이너를 가리킨다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:55432/papertrading
    username: papertrading
    password: papertrading
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          # SEQUENCE 변형이 실제로 배치되는지 보려면 켜야 한다.
          # IDENTITY인 운영 엔티티는 이 값과 무관하게 배치되지 않으므로 대조군은 영향받지 않는다.
          batch_size: 50
        order_inserts: true
  data:
    redis:
      host: localhost
      port: 56379

# 스케줄 작업을 하나도 돌리지 않는다. 벤치마크는 측정 대상을 직접 호출한다.
#
# 주기를 늘려 중화하던 방식은 기동 직후의 첫 실행을 막지 못했다(fixedDelay는 initialDelay가 없으면
# 바로 한 번 돈다). 재사용되는 벤치마크 DB에서는 그 첫 실행이 측정과 겹칠 수 있다.
#   - 당일 주문 실효: 이전 회차의 미체결 주문이 전부 실효 대상이라 주문 row 락을 잡으며 대량으로 돈다
#   - 총자산 평가: 쌓인 벤치마크 종목 전체의 시세를 조회하고 계좌를 일괄 갱신한다
#   - 원장 대사: 전 계좌 집계 질의 8개가 DB를 통째로 흔든다
#
# 스케줄러가 돌아가는 상태를 재야 할 때는 ./gradlew benchmarkTest -Pscheduling=true 로 켠다.
# 그때는 모든 스케줄러가 기본 주기로 돈다.
scheduling:
  enabled: false

toss-invest:
  websocket:
    # 스케줄링을 켜더라도 토스 WebSocket에는 연결하지 않는다. 외부 연결은 측정 대상이 아니다.
    enabled: false
