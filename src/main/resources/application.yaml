spring:
  application:
    name: paper-trading
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

security:
  jwt:
    secret: ${JWT_SECRET:paper-trading-local-development-jwt-secret-key-change-me}
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 14

toss-invest:
  openapi:
    base-url: https://openapi.tossinvest.com
    secret-token: ${TOSS_INVEST_SECRET_TOKEN:}
  rate-limit:
    orderbook-price-candle:
      default-limit: ${TOSS_RATE_LIMIT_GROUP_A_DEFAULT:5}
      safety-margin: ${TOSS_RATE_LIMIT_GROUP_A_MARGIN:0.8}
    market-calendar-exchange-rate:
      default-limit: ${TOSS_RATE_LIMIT_GROUP_B_DEFAULT:5}
      safety-margin: ${TOSS_RATE_LIMIT_GROUP_B_MARGIN:0.8}

market-calendar:
  cache:
    ttl-hours: ${MARKET_CALENDAR_CACHE_TTL_HOURS:12}

orderbook:
  cache:
    ttl-seconds: ${ORDERBOOK_CACHE_TTL_SECONDS:30}
  polling:
    fixed-delay-ms: ${ORDERBOOK_POLLING_FIXED_DELAY_MS:1000}
    lock-ttl-ms: ${ORDERBOOK_POLLING_LOCK_TTL_MS:900}

matching-engine:
  rematch:
    fixed-delay-ms: ${MATCHING_ENGINE_REMATCH_FIXED_DELAY_MS:30000}
  lock:
    ttl-ms: ${MATCHING_ENGINE_LOCK_TTL_MS:15000}
