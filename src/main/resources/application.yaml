spring:
  application:
    name: paper-trading
  task:
    scheduling:
      # 기본값이 1이라 느린 작업 하나가 지연에 민감한 작업(WS 재선언·스트림 소비)을 막는다.
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: scheduled-
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/papertrading}
    username: ${SPRING_DATASOURCE_USERNAME:papertrading}
    password: ${SPRING_DATASOURCE_PASSWORD:papertrading}
  jpa:
    hibernate:
      # 마이그레이션 도구가 없어 로컬에서만 ddl-auto로 스키마를 만든다. 운영에서는 none을 유지한다.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:none}
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

security:
  jwt:
    secret: ${JWT_SECRET:paper-trading-local-development-jwt-secret-key-change-me}
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 14

toss-invest:
  openapi:
    base-url: https://openapi.tossinvest.com
    client-id: ${TOSS_INVEST_CLIENT_ID:}
    secret-token: ${TOSS_INVEST_SECRET_TOKEN:}
  rate-limit:
    # 토스 실제 한도: MARKET_DATA 15, MARKET_DATA_CHART 20, MARKET_INFO 3 (초당)
    market-data:
      default-limit: ${TOSS_RATE_LIMIT_MARKET_DATA:15}
      safety-margin: ${TOSS_RATE_LIMIT_MARKET_DATA_MARGIN:0.8}
    market-data-chart:
      default-limit: ${TOSS_RATE_LIMIT_MARKET_DATA_CHART:20}
      safety-margin: ${TOSS_RATE_LIMIT_MARKET_DATA_CHART_MARGIN:0.8}
    market-info:
      default-limit: ${TOSS_RATE_LIMIT_MARKET_INFO:3}
      safety-margin: ${TOSS_RATE_LIMIT_MARKET_INFO_MARGIN:0.8}
  websocket:
    enabled: ${TOSS_WS_ENABLED:true}
    url: ${TOSS_WS_URL:wss://openapi-ws.tossinvest.com/ws/v1}
    market: ${TOSS_WS_MARKET:us}
    max-symbols-per-connection: ${TOSS_WS_MAX_SYMBOLS_PER_CONNECTION:100}
    connection-slots: ${TOSS_WS_CONNECTION_SLOTS:2}
    declare-debounce-ms: ${TOSS_WS_DECLARE_DEBOUNCE_MS:250}
    ping-interval-seconds: ${TOSS_WS_PING_INTERVAL_SECONDS:60}
    slot-lock-ttl-ms: ${TOSS_WS_SLOT_LOCK_TTL_MS:15000}
    slot-heartbeat-ms: ${TOSS_WS_SLOT_HEARTBEAT_MS:5000}
    # 거절된 종목을 다시 시도하기까지의 시간. 종목 마스터에 뒤늦게 등록되는 경우가 있다.
    rejected-symbol-ttl-ms: ${TOSS_WS_REJECTED_SYMBOL_TTL_MS:600000}

market-calendar:
  cache:
    ttl-hours: ${MARKET_CALENDAR_CACHE_TTL_HOURS:12}

orderbook:
  cache:
    # polling.staleness-threshold-ms보다 반드시 커야 한다.
    # 폴링이 30초마다 되살리는 동안 키가 만료되면, 호가가 조용한 WebSocket 구독 종목은
    # 주기적으로 캐시를 잃어 외부 유동성 없이 내부 체결만 하게 된다.
    ttl-seconds: ${ORDERBOOK_CACHE_TTL_SECONDS:120}
  polling:
    fixed-delay-ms: ${ORDERBOOK_POLLING_FIXED_DELAY_MS:1000}
    idle-fixed-delay-ms: ${ORDERBOOK_POLLING_IDLE_FIXED_DELAY_MS:20000}
    lock-ttl-ms: ${ORDERBOOK_POLLING_LOCK_TTL_MS:900}
    # 이 시간보다 캐시가 낡았을 때만 REST 폴링 대상이 된다.
    # WebSocket 재연결(2~3초)보다 넉넉해야 짧은 단절에 폴백이 헛돌지 않는다.
    staleness-threshold-ms: ${ORDERBOOK_STALENESS_THRESHOLD_MS:30000}
  active-symbols:
    refresh-ms: ${ORDERBOOK_ACTIVE_SYMBOLS_REFRESH_MS:5000}
    ttl-ms: ${ORDERBOOK_ACTIVE_SYMBOLS_TTL_MS:30000}

market-data:
  polling:
    scheduler:
      pool-size: ${MARKET_DATA_POLLING_POOL_SIZE:3}

matching-engine:
  dirty-drain:
    fixed-delay-ms: ${MATCHING_ENGINE_DIRTY_DRAIN_DELAY_MS:150}
    # 한 사이클이 길어지면 fixedDelay 간격 가정이 깨진다. 실행 시간을 보며 조정한다.
    batch-size: ${MATCHING_ENGINE_DIRTY_DRAIN_BATCH_SIZE:20}
    # 드레인은 fixedDelay 작업 하나뿐이라 풀을 키워도 동시에 두 개가 돌지 않는다.
    # 이 풀의 목적은 병렬 처리가 아니라 다른 스케줄 작업과의 격리이므로 1이면 충분하다.
    pool-size: ${MATCHING_ENGINE_DIRTY_DRAIN_POOL_SIZE:1}
  rematch:
    fixed-delay-ms: ${MATCHING_ENGINE_REMATCH_FIXED_DELAY_MS:30000}
  lock:
    ttl-ms: ${MATCHING_ENGINE_LOCK_TTL_MS:15000}
